<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Student Info</title>
</head>
<body>
    
    <h1>Student Information Form</h1>
    <br>
    <br>

    <div class="input-row">
      <input type="text" id="studentId" placeholder="Auto Generated ID" class="input" readonly />
      <input type="text" id="studentName" placeholder="Enter Name" class="input" />
      <input type="number" id="studentAge" placeholder="Enter Age" class="input" />
      <input type="email" id="studentEmail" placeholder="Enter Email" class="input" />
      <input type="text" id="studentCourse" placeholder="Enter Course" class="input" />
      <button id="addButton"  onclick="addStudent()" class="btn">Add Student</button>
    </div>
    
    <br>
    <br>

    <hr>

    <br>
    <br>


    <table border>
      <thead>
        <tr>
          <td>ID</td>
          <td>Name</td>
          <td>Age</td>
          <td>Email</td>
          <td>Course</td>
          <td>Active</td>
          <td>Action</td>
        </tr>
      </thead>

      <tbody id="parent">
        <!-- <tr>
          <td>101</td>
          <td>Jaffar</td>
          <td>24</td>
          <td>jaffar@gmail.com</td>
          <td>Web and app</td>
        </tr> -->
      </tbody>
    </table>


</body>
<script src="app.js"></script>
</html>
